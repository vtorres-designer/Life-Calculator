<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Calculator Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Life Calculator Pro</h1>
            <p class="subtitle">Multi-Scenario Financial Planning</p>
        </header>

        <!-- Scenario Tabs -->
        <div class="scenario-tabs-container">
            <div class="scenario-tabs">
                <!-- Tabs will be added here by JS -->
            </div>
            <button class="add-scenario-btn" onclick="addScenario()">+ Add Scenario</button>
        </div>

        <!-- Scenario Content Container -->
        <div class="scenario-content-container" id="scenarioContentContainer">
            <!-- Scenario content will be added here by JS -->
        </div>

        <!-- Comparison Section -->
        <div class="comparison-section">
            <h2>Scenario Comparison</h2>
            <div class="comparison-table-container">
                <table class="comparison-table">
                    <thead>
                        <tr>
                            <th>Scenario</th>
                            <th>Net Monthly</th>
                            <th>Annual Surplus</th>
                            <th>4-Year Projection</th>
                            <th>Biggest Expense</th>
                            <th>Savings Rate</th>
                            <th>Time to $12K</th>
                        </tr>
                    </thead>
                    <tbody id="comparisonTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Global Settings -->
        <div class="section global-settings">
            <h2>Global Settings</h2>
            <div class="settings-grid">
                <div class="input-group">
                    <label>Tax Rate (%)</label>
                    <input type="number" id="globalTaxRate" value="16.78" step="0.01" onchange="updateAllScenarios()">
                </div>
                <div class="input-group">
                    <label>Data Center Cost ($)</label>
                    <input type="number" id="globalDataCenterCost" value="12000" onchange="updateAllScenarios()">
                </div>
                <div class="input-group">
                    <label>Emergency Fund Goal ($)</label>
                    <input type="number" id="globalEmergencyFund" value="12000" onchange="updateAllScenarios()">
                </div>
            </div>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
